<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Social Network</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">MySocial</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Friends</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Notifications <span class="badge bg-primary" id="notifCount">0</span></a></li>
        <li class="nav-item"><a class="nav-link" href="#">Profile</a></li>
      </ul>
    </div>
  </div>
</nav>


<div style="height: 70px;"></div>

<div class="container-fluid">
  <div class="row">

    <!-- Friends Sidebar -->
    <div class="col-md-3 p-3 bg-black vh-100 text-white">
      <h6 class="text-muted">Friends</h6>
      <ul id="friendList" class="list-group list-group-dark"></ul>
    </div>

    <div class="col-md-6 p-3">
    
      <div class="card mb-4 p-3 bg-secondary shadow-sm rounded-4">
        <textarea placeholder="What's on your mind?" class="form-control mb-2"></textarea>
        <input type="file" id="postImage" class="form-control mb-2">
        <button id="postBtn" class="btn btn-primary w-100">Post</button>
      </div>
     
      <div id="postsFeed"></div>
    </div>

    <div class="col-md-3 p-3 bg-black vh-100 text-white">
      <h6 class="text-muted">Notifications</h6>
      <ul id="notifications" class="list-group list-group-dark"></ul>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
